# Global tools for the mise-me environment.
# Installed into $HOME by `mise run setup`; nothing here is machine specific.

[tools]
# Shell and prompt
starship = "latest"
eza = "latest"
bat = "latest"
zoxide = "latest"
fzf = "latest"
ripgrep = "latest"
jq = "latest"
github-cli = "latest"

# Languages and package managers
node = "22"
go = "latest"
rust = "latest"
uv = "latest"
pixi = "latest"
deno = "latest"

# Coding agent CLIs (sign in on each machine; no credentials are shipped)
claude = "latest"
codex = "latest"

# Workspace: herdr (multiplexer) and patronus
herdr = "latest"

[tools."github:darkquasar/patronus"]
version = "latest"
rename_exe = "patronus"

# Docker Sandboxes. Not in the mise registry, so it comes from its GitHub
# releases. macOS ships a signed app bundle; Linux ships a plain directory.
[tools."github:docker/sbx-releases"]
version = "latest"

[tools."github:docker/sbx-releases".platforms]
macos-arm64 = { asset_pattern = "DockerSandboxes-darwin.tar.gz", bin_path = "Sbx.app/Contents/MacOS" }
linux-x64 = { asset_pattern = "DockerSandboxes-linux-amd64.tar.gz", bin_path = "docker-sbx" }
linux-arm64 = { asset_pattern = "DockerSandboxes-linux-arm64.tar.gz", bin_path = "docker-sbx" }
