# atuin: shell history as a searchable database (Ctrl+R). Managed by mise-me.
# Everything stays on this machine: nothing syncs unless you run `atuin login`,
# and atuin does not check for updates over the network.
auto_sync = false
update_check = false

# Enter runs the selected command; Tab puts it on the line to edit first.
enter_accept = true
style = "compact"
inline_height = 20
# Start with every command; Ctrl+R again cycles to this folder, this session...
filter_mode = "global"
